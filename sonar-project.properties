# SonarQube Configuration for CSET Project
# This file configures SonarQube analysis for both .NET and Angular components

# Project identification
sonar.projectKey=cset
sonar.projectName=CSET
sonar.projectVersion=12.4.0
sonar.organization=cisa

# Source code paths
sonar.sources=CSETWebApi,CSETWebNg/src
sonar.tests=CSETWebApi,CSETWebNg/src

# Language-specific settings
sonar.language=cs,ts,js,html,css,scss

# .NET specific settings
sonar.cs.vstest.reportsPaths=CSETWebApi/**/TestResults/*.trx
sonar.cs.opencover.reportsPaths=CSETWebApi/coverage/**/coverage.opencover.xml
sonar.cs.vscoveragexml.reportsPaths=CSETWebApi/coverage/**/coverage.xml

# JavaScript/TypeScript specific settings
sonar.javascript.lcov.reportPaths=CSETWebNg/coverage/lcov.info
sonar.typescript.lcov.reportPaths=CSETWebNg/coverage/lcov.info

# Exclusions
sonar.exclusions=**/node_modules/**,**/bin/**,**/obj/**,**/dist/**,**/coverage/**,**/electron-builds/**,**/temp-electron/**,**/Diagram/**,**/LuceneIndex/**
sonar.test.exclusions=**/node_modules/**,**/bin/**,**/obj/**,**/dist/**,**/coverage/**,**/electron-builds/**,**/temp-electron/**,**/Diagram/**,**/LuceneIndex/**
sonar.coverage.exclusions=**/*.test.ts,**/*.spec.ts,**/*Test.cs,**/*Tests.cs,**/*.test.js,**/*.spec.js

# Security and quality gate settings
sonar.security.sources.python=CSETWebApi
sonar.security.sources.java=CSETWebApi
sonar.security.sources.cs=CSETWebApi
sonar.security.sources.javascript=CSETWebNg/src

# Code quality thresholds
sonar.coverage.minimum=70
sonar.duplicated_lines.density.minimum=3
sonar.reliability_rating.minimum=A
sonar.security_rating.minimum=A
sonar.maintainability_rating.minimum=A
sonar.security_hotspots_reviewed.minimum=90

# Additional settings
sonar.sourceEncoding=UTF-8
sonar.scm.provider=git
sonar.scm.forceReloadAll=true

# Security hotspots
sonar.security.hotspots.minimum=90

# Vulnerability detection
sonar.vulnerability.minimum=0

# Code smells
sonar.code_smells.minimum=0 