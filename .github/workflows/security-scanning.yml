name: Comprehensive Security Scanning

on:
  pull_request:
    branches:
      - develop
      - main
      - release/*
  push:
    branches:
      - develop
      - main
      - release/*
  schedule:
    - cron: "0 2 * * 0"  # Weekly security scan on Sundays at 2 AM

permissions:
  contents: read
  security-events: write
  pull-requests: write
  actions: read

env:
  SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
  SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
  ZAP_API_KEY: ${{ secrets.ZAP_API_KEY }}

jobs:
  # Enhanced Trivy scanning with more comprehensive coverage
  trivy-vulnerability-scan:
    name: Trivy Vulnerability Scan
    runs-on: ubuntu-latest
    strategy:
      matrix:
        scan-type: [fs, config, secret]
        severity: [CRITICAL, HIGH, MEDIUM]
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@0.31.0
        with:
          format: sarif
          output: trivy-${{ matrix.scan-type }}-${{ matrix.severity }}-results.sarif
          scan-type: ${{ matrix.scan-type }}
          scan-ref: .
          scanners: vuln
          severity: ${{ matrix.severity }}
          exit-code: 0  # Don't fail the build, just report

      - name: Upload Trivy scan results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-${{ matrix.scan-type }}-${{ matrix.severity }}-results.sarif

  # Docker image security scanning
  trivy-docker-scan:
    name: Docker Image Security Scan
    runs-on: ubuntu-latest
    needs: [build-api, build-web]
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Trivy Docker scanner
        uses: aquasecurity/trivy-action@0.31.0
        with:
          format: sarif
          output: trivy-docker-results.sarif
          scan-type: image
          scan-ref: ${{ secrets.IMAGE }}/api:latest
          scanners: vuln,config,secret
          severity: CRITICAL,HIGH

      - name: Upload Docker scan results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-docker-results.sarif

  # SonarQube code quality and security analysis
  sonarqube-analysis:
    name: SonarQube Analysis
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Full history for SonarQube

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: CSETWebNg/package-lock.json

      - name: Install Node.js dependencies
        working-directory: CSETWebNg
        run: npm ci

      - name: Build .NET solution
        working-directory: CSETWebApi
        run: dotnet build --configuration Release --no-restore

      - name: Run tests for .NET
        working-directory: CSETWebApi
        run: dotnet test --configuration Release --no-build --verbosity normal --collect:"XPlat Code Coverage" --results-directory ./coverage

      - name: SonarQube Scan
        uses: sonarqube-quality-gate-action@master
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          scannerHomebrew: SonarScanner
          args: >
            -Dsonar.projectKey=cset
            -Dsonar.projectName=CSET
            -Dsonar.projectVersion=12.4.0
            -Dsonar.sources=CSETWebApi,CSETWebNg/src
            -Dsonar.tests=CSETWebApi,CSETWebNg/src
            -Dsonar.cs.vstest.reportsPaths=CSETWebApi/**/TestResults/*.trx
            -Dsonar.cs.opencover.reportsPaths=CSETWebApi/coverage/**/coverage.opencover.xml
            -Dsonar.javascript.lcov.reportPaths=CSETWebNg/coverage/lcov.info
            -Dsonar.coverage.exclusions=**/*.test.ts,**/*.spec.ts,**/*Test.cs,**/*Tests.cs
            -Dsonar.exclusions=**/node_modules/**,**/bin/**,**/obj/**,**/dist/**,**/coverage/**
            -Dsonar.test.exclusions=**/node_modules/**,**/bin/**,**/obj/**,**/dist/**,**/coverage/**

  # Snyk dependency vulnerability scanning
  snyk-security-scan:
    name: Snyk Security Scan
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: CSETWebNg/package-lock.json

      - name: Install Snyk
        run: npm install -g snyk

      - name: Run Snyk to check for vulnerabilities
        working-directory: CSETWebNg
        run: snyk test --severity-threshold=high --json-file-output=snyk-results.json || true

      - name: Upload Snyk results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: CSETWebNg/snyk-results.json

  # OWASP ZAP Dynamic Application Security Testing
  zap-security-test:
    name: OWASP ZAP Security Test
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && (github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/main')
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Start ZAP
        uses: zaproxy/action-full-scan@v0.8.0
        with:
          target: 'http://localhost:5000'  # Adjust based on your API port
          rules_file_name: '.zap/rules.tsv'
          cmd_options: '-a'

      - name: Upload ZAP results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: zap-report.sarif

  # Security gate - prevents merging if critical vulnerabilities found
  security-gate:
    name: Security Gate
    runs-on: ubuntu-latest
    needs: [trivy-vulnerability-scan, sonarqube-analysis, snyk-security-scan]
    if: github.event_name == 'pull_request'
    
    steps:
      - name: Check for critical vulnerabilities
        run: |
          # Check if any critical vulnerabilities were found
          if [ -f "trivy-fs-CRITICAL-results.sarif" ]; then
            echo "Critical vulnerabilities found in filesystem scan"
            exit 1
          fi
          
          if [ -f "trivy-config-CRITICAL-results.sarif" ]; then
            echo "Critical vulnerabilities found in configuration scan"
            exit 1
          fi
          
          echo "No critical vulnerabilities found - security gate passed"
          
      - name: Comment on PR
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '✅ Security scanning completed successfully. No critical vulnerabilities found.'
            })

  # Security report generation
  security-report:
    name: Generate Security Report
    runs-on: ubuntu-latest
    needs: [trivy-vulnerability-scan, sonarqube-analysis, snyk-security-scan, zap-security-test]
    if: always()
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Generate Security Report
        run: |
          echo "# Security Scan Report - $(date)" > security-report.md
          echo "" >> security-report.md
          echo "## Scan Summary" >> security-report.md
          echo "- Trivy Vulnerability Scan: ${{ needs.trivy-vulnerability-scan.result }}" >> security-report.md
          echo "- SonarQube Analysis: ${{ needs.sonarqube-analysis.result }}" >> security-report.md
          echo "- Snyk Security Scan: ${{ needs.snyk-security-scan.result }}" >> security-report.md
          echo "- OWASP ZAP Test: ${{ needs.zap-security-test.result }}" >> security-report.md
          echo "" >> security-report.md
          echo "## Recommendations" >> security-report.md
          echo "1. Review all security findings in GitHub Security tab" >> security-report.md
          echo "2. Address critical and high severity vulnerabilities" >> security-report.md
          echo "3. Monitor security scan results regularly" >> security-report.md

      - name: Upload Security Report
        uses: actions/upload-artifact@v4
        with:
          name: security-report
          path: security-report.md
          retention-days: 30

  # Build jobs (needed for Docker scanning)
  build-api:
    name: Build API Docker Image
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4
      - name: Build API Docker image
        working-directory: ./CSETWebApi
        run: docker build -f Dockerfile . --tag ${{ secrets.IMAGE }}/api:latest

  build-web:
    name: Build Web Docker Image
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4
      - name: Build Web Docker image
        working-directory: ./CSETWebNg
        run: docker build -f Dockerfile . --tag ${{ secrets.IMAGE }}/web:latest 